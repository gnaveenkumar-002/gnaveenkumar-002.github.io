<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Naveen Kumar | Certifications</title>

  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body>

<div class="bg-animation"></div>

<nav>
  <div class="nav-container">
    <div class="logo">GNK</div>
    <ul class="navlist">
      <li><a href="index.html">Home</a></li>
    </ul>
  </div>
</nav>

<section style="margin-top: 100px;">
  <h2 class="section-title">Certifications</h2>

  <!-- TOP 4 -->
  <div class="cert-top-grid">

    <div class="cert-card">
      <img src="images/certs/java-fullstack.png" />
      <h4>Java Full Stack</h4>
      <p>EduSkills (APSCHE)</p>
    </div>

    <div class="cert-card">
      <img src="images/certs/ibm-cyber.png" />
      <h4>IBM Cybersecurity Analyst</h4>
      <p>IBM SkillsBuild</p>
    </div>

    <div class="cert-card">
      <img src="images/certs/bigdata.png" />
      <h4>Big Data Fundamentals</h4>
      <p>IBM</p>
    </div>

    <div class="cert-card">
      <img src="images/certs/java-coursera.png" />
      <h4>Java Programming</h4>
      <p>Coursera</p>
    </div>

  </div>

  <!-- VIEW ALL BUTTON -->
  <div class="view-all-wrap">
    <button class="btn" onclick="toggleAllCerts()">View All Certificates</button>
  </div>

  <!-- ALL CERTS (HIDDEN INITIALLY) -->
  <div id="allCerts" class="cert-all-grid">

    <!-- Repeat for all 20 -->
    <div class="cert-card"><img src="images/certs/ai-ml.png"/><h4>AI-ML Certificate</h4></div>
    <div class="cert-card"><img src="images/certs/Wipro-certificate.png"/><h4>Wipro Java Full Stack</h4></div>
    <div class="cert-card"><img src="images/certs/workshop.png"/><h4>Workshop Certificate</h4></div>
    <div class="cert-card"><img src="images/certs/java_basic.png"/><h4>Java Basic</h4></div>
  </div>

</section>

<script>
function toggleAllCerts() {
  const grid = document.getElementById("allCerts");
  if (grid.style.display === "grid") {
    grid.style.display = "none";
  } else {
    grid.style.display = "grid";
    window.scrollTo({ top: grid.offsetTop - 80, behavior: "smooth" });
  }
}
</script>

</body>
</html>
